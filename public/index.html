<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bilingle - matchmaking test client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 8px; font-size: 13px; color: #444; }
    input { padding: 6px; box-sizing: border-box; }
    input.full { width: 100%; }
    input.lang { width: 80px; }
    button { padding: 6px 14px; margin-right: 8px; margin-top: 12px; }
    #pairs { margin-top: 12px; padding-left: 18px; font-size: 13px; }
    #pairs li { margin-bottom: 4px; }
    #pairs button { margin: 0 0 0 8px; padding: 1px 6px; font-size: 11px; }
    #status { margin-top: 16px; padding: 12px; border-radius: 4px; background: #f0f0f0; white-space: pre-wrap; }
    #status.matched { background: #e6f4ea; }
    #status.left { background: #fdecea; }
    #chat { margin-top: 16px; }
    #video-container { margin-top: 16px; width: 100%; height: 300px; }
    #log { border: 1px solid #ccc; height: 160px; overflow-y: auto; padding: 8px; font-size: 13px; }
    #log .me { color: #1a73e8; }
    #log .them { color: #c5221f; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Bilingle matchmaking test client</h1>

  <label>Name <input id="name" class="full" value="Alex" /></label>

  <!-- A user can queue for several language pairs at once. In the real app
       these come from dropdowns of the languages on the user's profile. -->
  <label>Add a language pair (fluent -> learning)</label>
  <input id="fluentLang" class="lang" value="en" />
  <input id="learningLang" class="lang" value="tr" />
  <button id="addPair">Add pair</button>

  <ul id="pairs"></ul>

  <button id="join">Join queue</button>
  <!-- "Stop" = the `skip` event. Whoever clicks it IS auto-requeued. -->
  <button id="skip" class="hidden">Stop</button>
  <!-- Only shown after the PARTNER left - they are NOT auto-requeued, so
       rejoining has to be a manual action. -->
  <button id="new" class="hidden">New</button>

  <div id="status">Not connected.</div>

  <div id="video-container" class="hidden"></div>

  <div id="chat" class="hidden">
    <input id="message" class="full" placeholder="Type a message, press Enter" />
    <div id="log"></div>
  </div>

  <!-- Served automatically by the socket.io server, no CDN needed. -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <script src="/call.js"></script>
  <script>
    const socket = io();

    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const chatEl = document.getElementById('chat');
    const pairsEl = document.getElementById('pairs');
    const joinBtn = document.getElementById('join');
    const skipBtn = document.getElementById('skip');
    const newBtn = document.getElementById('new');
    const messageInput = document.getElementById('message');

    // Every pair we're willing to be matched on. The server queues us once
    // per pair, so more pairs means more chances to match.
    let pairs = [{ fluentLang: 'en', learningLang: 'tr' }];

    // Remembered from the `matched` event. The server does NOT put a sender
    // name on chat messages, so this is what we label incoming lines with.
    let partnerName = null;

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    function show(el, visible) {
      el.classList.toggle('hidden', !visible);
    }

    function renderPairs() {
      pairsEl.innerHTML = '';

      pairs.forEach((pair, index) => {
        const item = document.createElement('li');
        item.textContent = `${pair.fluentLang} -> ${pair.learningLang}`;

        const remove = document.createElement('button');
        remove.textContent = 'remove';
        remove.addEventListener('click', () => {
          pairs.splice(index, 1);
          renderPairs();
        });

        item.appendChild(remove);
        pairsEl.appendChild(item);
      });
    }

    function log(who, text, cls) {
      const line = document.createElement('div');
      line.className = cls;
      line.textContent = `${who}: ${text}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function joinQueue() {
      if (pairs.length === 0) {
        setStatus('Add at least one language pair first.');
        return;
      }

      // Note: we do NOT send socketId - the server takes it from the connection.
      socket.emit('join-queue', {
        name: document.getElementById('name').value,
        pairs,
      });
    }

    socket.on('connect', () => setStatus(`Connected as ${socket.id}. Not in the queue yet.`));

    // `waiting` arrives in two flavors and they mean different things:
    //   - no payload                 -> we are in the queue, searching
    //   - { reason: 'partner-left' } -> our partner left; we are NOT in the
    //     queue and must rejoin manually (classic Omegle "Stop" behavior)
    socket.on('waiting', (payload) => {
      partnerName = null;
      show(chatEl, false);

      if (payload && payload.reason === 'partner-left') {
        leaveCall();
        show(videoEl, false);
        setStatus('Stranger has disconnected.\nPress New to find someone else.', 'left');
        show(joinBtn, false);
        show(skipBtn, false);
        show(newBtn, true);
        return;
      }

      const summary = pairs.map((p) => `${p.fluentLang}->${p.learningLang}`).join(', ');
      setStatus(`Searching for a partner...\nQueued for: ${summary}`);
      show(joinBtn, false);
      show(skipBtn, true);
      show(newBtn, false);
    });

    socket.on('matched', ({ roomUrl, partner }) => {
      partnerName = partner.name;
      logEl.innerHTML = '';

      setStatus(
        `Matched with ${partner.name}\n` +
        `They are fluent in ${partner.fluentLang} and learning ${partner.learningLang}\n` +
        `Video room: ${roomUrl}`,
        'matched'
      );

      show(videoEl, true);
      joinCall(roomUrl, 'video-container');

      show(chatEl, true);
      show(joinBtn, false);
      show(skipBtn, true);
      show(newBtn, false);
      messageInput.focus();
    });

    // Payload is just { text } - we label it with the name we stored above.
    socket.on('chat-message', ({ text }) => {
      log(partnerName || 'Stranger', text, 'them');
    });

    document.getElementById('addPair').addEventListener('click', () => {
      const fluentLang = document.getElementById('fluentLang').value.trim();
      const learningLang = document.getElementById('learningLang').value.trim();
      if (!fluentLang || !learningLang) return;

      pairs.push({ fluentLang, learningLang });
      renderPairs();
    });

    joinBtn.addEventListener('click', joinQueue);
    newBtn.addEventListener('click', joinQueue);
    skipBtn.addEventListener('click', () => {
      leaveCall();
      show(videoEl, false);
      socket.emit('skip');
    });


    messageInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;

      const text = messageInput.value;
      if (!text.trim()) return;

      socket.emit('send-message', { text });
      log('You', text, 'me');
      messageInput.value = '';
    });

    renderPairs();
  </script>
</body>
</html>
